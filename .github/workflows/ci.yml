name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: pytest -q
      - run: pip install pip-audit && pip-audit

  browser-rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: RUN_BROWSER_TESTS=1 pytest -q tests/test_widget_rendering.py

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - name: Wait for migrated API health check
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify real Redis rate limiting and a separate client's dashboard visibility
        run: |
          mkdir -p .acceptance
          docker compose --profile verification run --rm acceptance-verifier burst
          docker compose --profile verification run --rm acceptance-verifier independent
      - run: docker compose down --volumes
